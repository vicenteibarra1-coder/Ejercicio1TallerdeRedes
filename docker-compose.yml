services:
  servidor:
    image: python:3-slim
    command:
      - python3
      - -c
      - |
        import http.server, random, string
        F = 'MINI{' + ''.join(random.choices(string.ascii_lowercase + string.digits, k=6)) + '}'
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(('secreto=' + F + chr(10)).encode())
            def log_message(self, *a):
                pass
        http.server.HTTPServer(('', 8080), H).serve_forever()
    networks:
      lab:
        ipv4_address: 172.30.0.10
  cliente:
    image: curlimages/curl
    command: sh -c 'while true; do curl -s http://172.30.0.10:8080/; sleep 3; done'
    networks:
      lab:
        ipv4_address: 172.30.0.20
  atacante:
    image: ubuntu:22.04
    command: sleep infinity
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      lab:
        ipv4_address: 172.30.0.40
networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.0.0/24
